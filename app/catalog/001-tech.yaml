# Well-known technology companies and consumer products, from the local theSVG clone.
# Curated subset: brands most people recognise, and only marks that do not spell
# the answer out. Wordmark logos (Amazon, Intel, Samsung, Oracle, IBM, Dell, HP,
# eBay, Nintendo, Epic Games, DJI, Roku, Sonos, Kraken, ...) are left out because
# they give the answer away, and a few marks that are just the name in letters
# (X, previously Twitter) are out for the same reason. 30 of the 78 are drawn at
# random per game. Software engineering tools live in the Dev category.
